name: RelayCode

options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  RelayCodeCore:
    type: framework
    platform: iOS
    sources:
      - path: RelayCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseo.relaycode.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: targeted

  RelayCode:
    type: application
    platform: iOS
    sources:
      - path: RelayCode
    dependencies:
      - target: RelayCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseo.relaycode
        PRODUCT_NAME: RelayCode
        INFOPLIST_FILE: RelayCode/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: targeted
    scheme:
      testTargets:
        - RelayCodeTests

  RelayCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RelayCodeTests
    dependencies:
      - target: RelayCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseo.relaycode.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: targeted
