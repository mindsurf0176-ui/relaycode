name: RelayCode

options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "1"
    RELAYCODE_BUNDLE_ID: com.minseo.relaycode
    DEVELOPMENT_TEAM: ""

targets:
  RelayCodeCore:
    type: framework
    platform: iOS
    sources:
      - path: RelayCodeCore
        excludes:
          - "**/* [0-9]*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseo.relaycode.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: targeted

  LiteRTLM:
    type: framework
    platform: iOS
    sources:
      - path: RelayCodeLiteRTRuntime/Sources/LiteRTLM
    dependencies:
      - framework: RelayCodeLiteRTRuntime/vendor/CLiteRTLM.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseo.relaycode.litertlm
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-all_load"

  RelayCode:
    type: application
    platform: iOS
    sources:
      - path: RelayCode
        excludes:
          - "**/* [0-9]*.swift"
      - path: RelayCodeLinuxRuntime
    dependencies:
      - target: RelayCodeCore
      - target: LiteRTLM
      - framework: RelayCodeLlamaRuntime/vendor/llama.xcframework
        embed: true
      - framework: RelayCodeLiteRTRuntime/vendor/CLiteRTLM.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(RELAYCODE_BUNDLE_ID)"
        PRODUCT_NAME: RelayCode
        INFOPLIST_FILE: RelayCode/Info.plist
        CODE_SIGN_ENTITLEMENTS: RelayCode/RelayCode.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_OBJC_BRIDGING_HEADER: RelayCode/RelayCode-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/RelayCodeLinuxRuntime/include"
          - "$(SRCROOT)/RelayCodeLinuxRuntime/vendor"
    scheme:
      testTargets:
        - RelayCodeTests

  RelayCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RelayCodeTests
        excludes:
          - "**/* [0-9]*.swift"
    dependencies:
      - target: RelayCodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseo.relaycode.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: targeted
